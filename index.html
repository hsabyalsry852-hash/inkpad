<script>
(()=>{const Q=[];let cur=null;
const pump=()=>{if(cur||!Q.length)return;const q=cur=Q.shift(),o=q.o;
 const w=document.createElement('div');w.className='dlg';
 w.innerHTML='<div class="dbox" role="dialog" aria-modal="true"><p></p>'+(o.input?'<input type="text" dir="auto" enterkeyhint="done" autocomplete="off">':'')+'<div class="dbt">'+(o.input||o.cancel?'<button class="dc">'+(o.no||'إلغاء')+'</button>':'')+'<button class="do'+(o.danger?' danger':'')+'">'+(o.yes||(o.danger?'حذف':'موافق'))+'</button></div></div>';
 w.querySelector('p').textContent=q.m;const inp=w.querySelector('input');if(inp)inp.value=o.def||'';
 const close=v=>{if(cur!==q)return;document.removeEventListener('keydown',kd,true);w.remove();cur=null;q.r(v);pump()};
 const ok=()=>close(o.input?inp.value:true),no=()=>close(o.input?null:o.cancel?false:true);
 const kd=e=>{if(e.key==='Escape'){e.preventDefault();no()}else if(e.key==='Enter'&&(inp||e.target.tagName!=='BUTTON')){e.preventDefault();ok()}};
 w.querySelector('.do').onclick=ok;const c=w.querySelector('.dc');c&&(c.onclick=no);
 w.addEventListener('pointerdown',e=>{if(e.target===w)no()});
 document.addEventListener('keydown',kd,true);document.body.append(w);
 setTimeout(()=>{inp?(inp.focus(),inp.select()):w.querySelector(o.nf&&w.querySelector('.dc')?'.dc':'.do').focus()},60)};
const dlg=(m,o={})=>new Promise(r=>{Q.push({m:String(m),o,r});pump()});
window.inkAsk=(m,d)=>dlg(m,{input:1,def:d==null?'':d});
window.inkConfirm=m=>dlg(m,{cancel:1,danger:/^حذف/.test(String(m))});
window.inkYN=(m,y,n,nf)=>dlg(m,{cancel:1,yes:y||'نعم',no:n||'لا',nf:nf});
window.alert=m=>{dlg(m)};
})();
</script>

<script>// ---- v10: home pages tabs ----
(()=>{const g=document.getElementById('hpg'),T=[...document.querySelectorAll('#htabs [data-hp]')],P=[document.getElementById('hp0'),document.getElementById('hp1')];
if(!g)return;
const mark=i=>T.forEach((b,k)=>b.classList.toggle('on',k===i));
T.forEach((b,k)=>b.addEventListener('click',()=>{mark(k);P[k].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'})}));
let t=0;g.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>mark(Math.round(Math.abs(g.scrollLeft)/(g.clientWidth||1))),60)},{passive:true});
})();</script>
