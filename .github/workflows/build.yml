name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Write build files and build APK
        run: |
          cat > package.json <<'EOF'
          {
            "name": "inkpad-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0",
              "tesseract.js": "5.1.1"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.inkpad.app",
            "appName": "InkPad",
            "webDir": "www",
            "backgroundColor": "#0f172a"
          }
          EOF
          mkdir -p native
          cat > native/InkOpenPlugin.java <<'EOF'
          package com.inkpad.app;

          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(name = "InkOpen")
          public class InkOpenPlugin extends Plugin {

              private static JSObject pending = null;

              /** Called from MainActivity with the launching / new intent. */
              public static void handle(final Context ctx, final Intent intent) {
                  if (intent == null || intent.getBooleanExtra("ink_handled", false)) return;
                  String action = intent.getAction();
                  Uri uri = null;
                  if (Intent.ACTION_VIEW.equals(action)) {
                      uri = intent.getData();
                  } else if (Intent.ACTION_SEND.equals(action)) {
                      uri = (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  }
                  if (uri == null) return;
                  intent.putExtra("ink_handled", true);
                  final Uri u = uri;
                  new Thread(() -> {
                      JSObject o = new JSObject();
                      try {
                          String name = "file.pdf";
                          try (Cursor c = ctx.getContentResolver().query(u, null, null, null, null)) {
                              if (c != null && c.moveToFirst()) {
                                  int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                                  if (i >= 0) name = c.getString(i);
                              }
                          } catch (Exception ignored) {}
                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                          try (InputStream in = ctx.getContentResolver().openInputStream(u)) {
                              byte[] buf = new byte[65536];
                              int n;
                              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          }
                          o.put("name", name);
                          o.put("data", Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP));
                      } catch (Exception e) {
                          o.put("error", String.valueOf(e.getMessage()));
                      }
                      synchronized (InkOpenPlugin.class) { pending = o; }
                  }).start();
              }

              @PluginMethod
              public void getPending(PluginCall call) {
                  JSObject r;
                  synchronized (InkOpenPlugin.class) {
                      r = pending != null ? pending : new JSObject();
                      pending = null;
                  }
                  call.resolve(r);
              }
          }
          EOF
          cat > native/InkLockPlugin.java <<'EOF'
          package com.inkpad.app;

          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.Build;
          import android.os.CancellationSignal;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.util.concurrent.atomic.AtomicBoolean;

          /** Fingerprint / face unlock using the framework BiometricPrompt (Android 9+). No extra dependency. */
          @CapacitorPlugin(name = "InkLock")
          public class InkLockPlugin extends Plugin {

              private boolean canUse() {
                  if (Build.VERSION.SDK_INT < 28) return false;
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          BiometricManager bm = getContext().getSystemService(BiometricManager.class);
                          return bm != null && bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                                  == BiometricManager.BIOMETRIC_SUCCESS;
                      }
                      if (Build.VERSION.SDK_INT >= 29) {
                          BiometricManager bm = getContext().getSystemService(BiometricManager.class);
                          return bm != null && bm.canAuthenticate() == BiometricManager.BIOMETRIC_SUCCESS;
                      }
                      return getContext().getPackageManager().hasSystemFeature(PackageManager.FEATURE_FINGERPRINT);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static JSObject res(boolean ok, String err) {
                  JSObject r = new JSObject();
                  r.put("ok", ok);
                  if (err != null) r.put("error", err);
                  return r;
              }

              @PluginMethod
              public void available(PluginCall call) {
                  call.resolve(res(canUse(), null));
              }

              @PluginMethod
              public void authenticate(final PluginCall call) {
                  if (!canUse()) {
                      call.resolve(res(false, "unavailable"));
                      return;
                  }
                  final Activity a = getActivity();
                  final String title = call.getString("title", "InkPad");
                  final String sub = call.getString("subtitle", "");
                  final AtomicBoolean done = new AtomicBoolean(false);
                  a.runOnUiThread(() -> {
                      try {
                          BiometricPrompt.Builder b = new BiometricPrompt.Builder(a)
                                  .setTitle(title)
                                  .setNegativeButton("استخدم الرقم السري", a.getMainExecutor(), (d, w) -> {
                                      if (done.compareAndSet(false, true)) call.resolve(res(false, "cancel"));
                                  });
                          if (sub != null && !sub.isEmpty()) b.setSubtitle(sub);
                          if (Build.VERSION.SDK_INT >= 30) {
                              b.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK);
                          }
                          b.build().authenticate(new CancellationSignal(), a.getMainExecutor(),
                                  new BiometricPrompt.AuthenticationCallback() {
                                      @Override
                                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                          if (done.compareAndSet(false, true)) call.resolve(res(true, null));
                                      }

                                      @Override
                                      public void onAuthenticationError(int code, CharSequence msg) {
                                          if (done.compareAndSet(false, true)) call.resolve(res(false, String.valueOf(msg)));
                                      }
                                  });
                      } catch (Exception e) {
                          if (done.compareAndSet(false, true)) call.resolve(res(false, String.valueOf(e.getMessage())));
                      }
                  });
              }
          }
          EOF
          mkdir -p native
          cat > native/MainActivity.java <<'EOF'
          package com.inkpad.app;

          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.ActionMode;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              // The app draws its own selection bar (colors / translate / copy), so hide Android's floating
              // text toolbar (Copy / Web search / Google Translate ...) while text is selected in the PDF.
              // It stays visible when the cursor is in an input box so paste keeps working.
              private ActionMode selMode;
              private final Handler selH = new Handler(Looper.getMainLooper());
              private final Runnable selHide = new Runnable() {
                  @Override
                  public void run() {
                      final ActionMode m = selMode;
                      if (m == null) return;
                      try {
                          getBridge().getWebView().evaluateJavascript(
                              "(function(){var a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable))})()",
                              value -> {
                                  if (m != selMode || "true".equals(value)) return;
                                  try {
                                      m.getMenu().clear();
                                      if (Build.VERSION.SDK_INT >= 23) m.hide(3000);
                                  } catch (Exception ignored) {}
                              });
                      } catch (Exception ignored) {}
                      selH.postDelayed(this, 2000);
                  }
              };

              @Override
              public void onActionModeStarted(ActionMode mode) {
                  super.onActionModeStarted(mode);
                  if (Build.VERSION.SDK_INT >= 23 && mode.getType() == ActionMode.TYPE_FLOATING) {
                      selMode = mode;
                      selH.removeCallbacks(selHide);
                      selH.post(selHide);
                  }
              }

              @Override
              public void onActionModeFinished(ActionMode mode) {
                  super.onActionModeFinished(mode);
                  if (mode == selMode) {
                      selMode = null;
                      selH.removeCallbacks(selHide);
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(InkOpenPlugin.class);
                  registerPlugin(InkLockPlugin.class);
                  super.onCreate(savedInstanceState);
                  InkOpenPlugin.handle(this, getIntent());

                  // Back button: ask the page first (close menu / close open document); exit only if it says no.
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          getBridge().getWebView().evaluateJavascript(
                              "(function(){try{return window.inkBack?window.inkBack():false}catch(e){return false}})()",
                              value -> {
                                  if (!"true".equals(value)) finish();
                              });
                      }
                  });
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  InkOpenPlugin.handle(this, intent);
              }
          }
          EOF
          mkdir -p native
          cat > native/native.js <<'EOF'
          // Native bridge for the Android build only. Loaded after extra.js.
          (()=>{
          const C=window.Capacitor;
          if(!C||!C.isNativePlatform||!C.isNativePlatform()||!C.Plugins)return;
          const Ink=C.Plugins.InkOpen,FS=C.Plugins.Filesystem,SH=C.Plugins.Share;
          const bytes=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

          // 1) PDF opened from WhatsApp / Files / share sheet: ask native for a pending file
          let busy=0,warned=0;
          const poll=async()=>{
            if(busy||!Ink)return;busy=1;
            try{
              const r=await Ink.getPending();
              if(r&&r.error)alert('خطأ في قراءة الملف: '+r.error);
              else if(r&&r.data){
                const id=await imp(new File([bytes(r.data)],r.name||'file.pdf',{type:'application/pdf'}));
                await openDoc(id);
              }
            }catch(x){if(!warned++)alert('InkOpen: '+(x&&x.message||x))}
            busy=0;
          };
          const burst=()=>{let n=0;const t=setInterval(()=>{poll();if(++n>24)clearInterval(t)},500)};
          burst();
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)burst()});

          // 2) Downloads (export PDF / backup): WebView ignores blob downloads, so use the share sheet
          const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
          const orig=HTMLAnchorElement.prototype.click;
          HTMLAnchorElement.prototype.click=function(){
            if(this.download&&/^blob:/.test(this.href)&&FS&&SH){
              const name=this.download;
              fetch(this.href).then(r=>r.blob()).then(b64).then(async data=>{
                const f=await FS.writeFile({path:name,data,directory:'CACHE'});
                await SH.share({title:name,url:f.uri,dialogTitle:'حفظ / مشاركة'});
              }).catch(x=>{if(!/cancel/i.test(String(x&&x.message||x)))alert('تعذر الحفظ: '+(x&&x.message||x))});
              return;
            }
            return orig.apply(this,arguments);
          };
          // 3) Android back button: called from MainActivity. Returns true if the page handled it.
          window.inkBack=()=>{
            const pops=[...document.querySelectorAll('.pop,#mm')].filter(p=>!p.hidden);
            if(pops.length){pops.forEach(p=>p.hidden=true);return true}
            const ed=document.getElementById('ed'),bk=document.getElementById('bk');
            if(ed&&!ed.hidden&&bk){bk.click();return true}
            return false;
          };
          })();
          EOF
          mkdir -p scripts
          cat > scripts/prepare.sh <<'EOF'
          #!/usr/bin/env bash
          # Copies the web app into www/, bundles pdf.js + pdf-lib locally (works offline),
          # removes the service worker (the APK already ships the files) and injects native.js.
          set -euo pipefail
          rm -rf www && mkdir -p www/lib
          cp index.html app.js extra.js plus.js style.css manifest.json icon-192.png icon-512.png www/
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL $B/pdf.js/3.11.174/pdf.min.js        -o www/lib/pdf.min.js
          curl -fsSL $B/pdf.js/3.11.174/pdf.worker.min.js -o www/lib/pdf.worker.min.js
          curl -fsSL $B/pdf-lib/1.17.1/pdf-lib.min.js     -o www/lib/pdf-lib.min.js
          # ---- offline OCR (Tesseract + Arabic/English data) ----
          mkdir -p www/lib/tess
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/lib/tess/
          cp node_modules/tesseract.js-core/tesseract-core*.js www/lib/tess/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm www/lib/tess/ 2>/dev/null || true
          for L in ara eng; do
            curl -fsSL --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/$L.traineddata | gzip -9 > www/lib/tess/$L.traineddata.gz
          done
          # ---- offline translation (transformers.js + opus-mt en<->ar) ----
          mkdir -p www/lib/ort
          J=https://cdn.jsdelivr.net/npm
          curl -fsSL --retry 3 $J/@xenova/transformers@2.17.2/dist/transformers.min.js -o www/lib/transformers.min.js
          for W in ort-wasm.wasm ort-wasm-simd.wasm ort-wasm-threaded.wasm ort-wasm-simd-threaded.wasm; do
            curl -fsSL --retry 3 $J/onnxruntime-web@1.14.0/dist/$W -o www/lib/ort/$W
          done
          for M in opus-mt-en-ar opus-mt-ar-en; do
            mkdir -p www/models/$M/onnx
            for F in config.json tokenizer.json tokenizer_config.json onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
              curl -fsSL --retry 3 https://huggingface.co/Xenova/$M/resolve/main/$F -o www/models/$M/$F
            done
            curl -fsSL --retry 3 https://huggingface.co/Xenova/$M/resolve/main/generation_config.json -o www/models/$M/generation_config.json || true
          done
          test -s www/lib/tess/tesseract.min.js && test -s www/lib/tess/ara.traineddata.gz && test -s www/models/opus-mt-ar-en/onnx/encoder_model_quantized.onnx
          ls www/lib/tess; du -sh www
          cp native/native.js www/native.js
          cd www
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#lib/#g; s#https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/#lib/#g" index.html app.js
          sed -i "s#if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');##" app.js
          sed -i 's#<script src="extra.js"></script>#<script src="extra.js"></script><script src="native.js"></script>#' index.html
          grep -q 'native.js' index.html || { echo "native.js injection failed"; exit 1; }
          grep -q 'lib/pdf.min.js' index.html || { echo "pdf.js rewrite failed"; exit 1; }
          echo "www ready"
          EOF
          mkdir -p scripts
          cat > scripts/patch_android.py <<'EOF'
          import re, shutil, glob, os
          root = 'android/app/src/main'
          # 1) Java files
          d = f'{root}/java/com/inkpad/app'
          os.makedirs(d, exist_ok=True)
          for f in ('MainActivity.java', 'InkOpenPlugin.java', 'InkLockPlugin.java'):
              shutil.copy(f'native/{f}', f'{d}/{f}')

          # 2) "Open with" + "Share" for PDFs
          p = f'{root}/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          filters = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/pdf" />
                      </intent-filter>
          '''
          if 'USE_BIOMETRIC' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          assert '</activity>' in s
          s = s.replace('</activity>', filters + '        </activity>', 1)
          open(p, 'w', encoding='utf-8').write(s)

          # 3) App icon from icon-512.png
          for m in glob.glob(f'{root}/res/mipmap-*'):
              if 'anydpi' in m:
                  shutil.rmtree(m)
              else:
                  for n in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                      shutil.copy('icon-512.png', f'{m}/{n}')
          gp = 'android/gradle.properties'
          t = open(gp, encoding='utf-8').read() if os.path.exists(gp) else ''
          t = re.sub(r'(?m)^org\.gradle\.jvmargs=.*\n?', '', t) + '\norg.gradle.jvmargs=-Xmx3g\n'
          open(gp, 'w', encoding='utf-8').write(t)
          print('android patched')
          EOF
          mkdir -p scripts
          cat > scripts/build.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bash scripts/prepare.sh
          npx cap add android
          python3 scripts/patch_android.py
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          echo "APK: android/app/build/outputs/apk/debug/app-debug.apk"
          EOF
          chmod +x scripts/*.sh
          npm install
          bash scripts/build.sh

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk InkPad.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest InkPad.apk --title "InkPad APK" --notes "Latest Android build" --latest
