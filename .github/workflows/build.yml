name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # اختياري: مفتاح توقيع ثابت عشان كل نسخة تتثبّت فوق اللي قبلها (شوف README)
      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the stable signing key"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 غير موجود. كل APK هيتوقّع بمفتاح مختلف ومش هيتثبّت فوق النسخة القديمة"
          fi
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build APK
        run: |
          chmod +x scripts/*.sh
          bash scripts/build.sh
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk InkPad.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest InkPad.apk --clobber
            gh release edit latest --notes "Build ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          else
            gh release create latest InkPad.apk --title "InkPad APK" --notes "Build ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})" --latest
          fi
